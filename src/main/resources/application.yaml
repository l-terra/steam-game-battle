spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/steam_battle_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  security:
    user:
      name: ${APP_USER}
      password: ${APP_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  backend-url: ${APP_BACKEND_URL:http://localhost:8080}

steam:
  api-url: ${STEAM_API_URL}
  api-key: ${STEAM_API_KEY}
  steamid: ${MY_STEAM_ID}